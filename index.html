<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href='https://fonts.googleapis.com/css?family=Itim' rel='stylesheet'>
    <title>etch-a-sketch</title>
</head>

<body>
    <header>
        <h1>Etch-A-Sketch</h1>
    </header>

    <div class="container">
        <div class="sketchPad"></div>
        <div class="controls">
            <button id="change">+/-</button>
            <div class="status">16 x 16</div>
            <button id="clear">C</button>
        </div>
    </div>

    <footer>
        <a href="https://github.com/Septerm/etch-a-sketch">
            <img src="./images/github-img.svg" alt="Github logo">
        </a>
        <p itemprop="author" itemscope itemtype="https://schema.org/Person">Created by <span itemprop="name">Garion Charles</span></p>
    </footer>


    <script src="./script.js"></script>
</body>

</html>
